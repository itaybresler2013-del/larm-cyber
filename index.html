<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber - פלטפורמת לימוד תכנות</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth.css">
    
    <!-- Firebase SDK (Modular) -->
    <script type="module" src="/js/firebase-init.js" defer></script>
    <script type="module" src="/js/auth.js" defer></script>
    <script src="/js/particles.js" defer></script>
</head>
<body>
    <!-- Particles Background -->
    <canvas id="particles-bg"></canvas>

    <!-- PROMO SCREEN -->
    <div id="promo-screen" class="promo-container">
        <div class="promo-content">
            <h1 class="promo-text text-neon-blue fade-in" id="promo-text-1">לא רק ללמוד תכנות...</h1>
            <h1 class="promo-text text-neon-purple hidden fade-in" id="promo-text-2">להפוך למאסטר.</h1>
            
            <div class="skills-showcase hidden" id="promo-skills">
                <div class="skill-card text-neon-blue">HTML <span class="xp">+100 XP</span></div>
                <div class="skill-card text-neon-purple">CSS <span class="xp">+150 XP</span></div>
                <div class="skill-card text-neon-pink">JS <span class="xp">+300 XP</span></div>
            </div>

            <h2 class="promo-final text-neon-blue hidden fade-in" id="promo-text-3">Learn. Build. Level Up.</h2>
            
            <button id="start-btn" class="btn-neon hidden fade-in mt-4">START NOW</button>
        </div>
    </div>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="auth-container hidden">
        <div class="glass-panel auth-box fade-in">
            <h1 class="text-neon-blue text-center mb-2">NEON CYBER</h1>
            <p class="text-muted text-center mb-4">התחבר למערכת ותתחיל לצבור XP</p>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login">התחברות</button>
                <button class="auth-tab" id="tab-register">הרשמה</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label>אימייל</label>
                    <input type="email" id="login-email" required placeholder="Gamer@example.com">
                </div>
                <div class="input-group">
                    <label>סיסמה</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-neon w-100 mt-2">היכנס למשחק</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form hidden">
                <div class="input-group">
                    <label>שם מלא (Gamer Tag)</label>
                    <input type="text" id="register-name" required placeholder="CyberNinja99">
                </div>
                <div class="input-group">
                    <label>מספר טלפון</label>
                    <input type="tel" id="register-phone" required placeholder="050-0000000">
                </div>
                <div class="input-group">
                    <label>אימייל</label>
                    <input type="email" id="register-email" required placeholder="Gamer@example.com">
                </div>
                <div class="input-group">
                    <label>סיסמה</label>
                    <input type="password" id="register-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-neon purple w-100 mt-2">צור שחקן חדש</button>
            </form>

            <div id="auth-error" class="error-msg hidden mt-2"></div>
            <div id="auth-loader" class="loader hidden"></div>
        </div>
    </div>

</body>
</html>
