<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber - Sandbox</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/sandbox.css">
    <script src="/js/sandbox.js" defer></script>
</head>
<body>
    <div class="sandbox-layout">
        <!-- Header -->
        <header class="sandbox-header glass-panel">
            <div class="header-left">
                <button class="btn-icon" onclick="window.location.href='/larn'">🔙</button>
                <h2 class="text-neon-blue">Sandbox Mode</h2>
            </div>
            <div class="header-right">
                <button id="btn-run" class="btn-neon small">▶ Run Code</button>
                <button id="btn-reset" class="btn-neon small purple">↺ Reset</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="sandbox-main">
            <!-- Code Editor Area -->
            <div class="editor-area">
                <div class="tabs">
                    <button class="tab-btn active" data-target="html-editor">HTML</button>
                    <button class="tab-btn" data-target="css-editor">CSS</button>
                    <button class="tab-btn" data-target="js-editor">JavaScript</button>
                </div>
                
                <div class="editors">
                    <textarea id="html-editor" class="code-input active" spellcheck="false">&lt;h1&gt;Hello Cyber World&lt;/h1&gt;</textarea>
                    <textarea id="css-editor" class="code-input" spellcheck="false">h1 { color: #00f3ff; text-shadow: 0 0 10px #00f3ff; }</textarea>
                    <textarea id="js-editor" class="code-input" spellcheck="false">console.log('System ready.');</textarea>
                </div>
            </div>

            <!-- Preview Area -->
            <div class="preview-area">
                <h3 class="preview-title text-neon-purple">Live Preview</h3>
                <div class="preview-container glass-panel">
                    <iframe id="preview-frame"></iframe>
                </div>
            </div>

            <!-- AI Assistant Panel -->
            <aside class="ai-panel glass-panel">
                <div class="ai-header">
                    <div class="ai-avatar">🤖</div>
                    <h3 class="text-neon-pink">AI Assistant</h3>
                </div>
                <div class="ai-chat" id="ai-chat">
                    <div class="message ai-msg">
                        שלום אלוף! אני העוזר האישי שלך. צריך עזרה עם הקוד?
                    </div>
                </div>
                <div class="ai-input-area">
                    <input type="text" id="ai-input" placeholder="שאל אותי משהו...">
                    <button id="ai-send" class="btn-icon">➤</button>
                </div>
            </aside>
        </main>
    </div>
</body>
</html>
