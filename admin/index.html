<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber - Admin Control</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/admin/admin.css">
    <script src="/admin/admin.js" defer></script>
</head>
<body class="admin-body">
    <!-- Admin Login -->
    <div id="admin-login" class="admin-login-container fade-in">
        <div class="glass-panel auth-box">
            <h1 class="text-neon-pink text-center mb-2">SYSTEM OVERRIDE</h1>
            <p class="text-muted text-center mb-4">התחברות מנהל מערכת</p>
            
            <form id="admin-form" class="auth-form">
                <div class="input-group">
                    <label>קוד גישה (Admin Key)</label>
                    <input type="password" id="admin-key" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-neon purple w-100 mt-2">ACCESS SYSTEM</button>
            </form>
            <div id="admin-error" class="error-msg hidden mt-2">קוד שגוי. הגישה נדחתה.</div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="admin-layout hidden">
        <nav class="admin-sidebar glass-panel">
            <h2 class="text-neon-blue mb-4 text-center">NEON ADMIN</h2>
            <ul class="nav-links">
                <li class="active" data-target="dashboard">Dashboard</li>
                <li data-target="users">ניהול משתמשים</li>
                <li data-target="logs">לוגים - Anti-Cheat</li>
            </ul>
            <button id="admin-logout" class="btn-neon small mt-4 w-100">LOGOUT</button>
        </nav>

        <main class="admin-main">
            <!-- Dashboard View -->
            <section id="view-dashboard" class="admin-view active fade-in">
                <h2 class="text-neon-blue mb-4">Live Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card glass-panel">
                        <h4 class="text-muted">משתמשים רשומים</h4>
                        <div class="stat-value text-neon-blue" id="stat-users">1</div>
                    </div>
                    <div class="stat-card glass-panel">
                        <h4 class="text-muted">אירועי רמאות</h4>
                        <div class="stat-value text-neon-pink" id="stat-cheats">0</div>
                    </div>
                    <div class="stat-card glass-panel">
                        <h4 class="text-muted">ממוצע ציונים</h4>
                        <div class="stat-value text-neon-green" id="stat-score">85%</div>
                    </div>
                </div>
            </section>

            <!-- Logs View -->
            <section id="view-logs" class="admin-view hidden fade-in">
                <h2 class="text-neon-pink mb-4">Security Logs</h2>
                <div class="glass-panel table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>זמן</th>
                                <th>משתמש</th>
                                <th>אירוע</th>
                            </tr>
                        </thead>
                        <tbody id="logs-body">
                            <!-- Logs will be injected here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
